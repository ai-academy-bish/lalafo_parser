[project]
name = "lalafo-parser"
version = "1.1.0"
description = "Scraper and HuggingFace dataset builder for lalafo.kg (Kyrgyzstan real estate)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # Cloudflare warm-up: real browser that passes Turnstile
    "nodriver>=0.38",
    "opencv-python-headless>=4.9",   # nodriver's verify_cf() Turnstile helper
    # browserless API client with a Chrome TLS fingerprint
    "curl_cffi>=0.7",
    # configuration
    "pyyaml>=6.0",
    # logging & progress
    "rich>=13.7",
    # dataset packaging
    "datasets>=2.19",
    "pyarrow>=15.0",
    "pillow>=10.0",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
lalafo = "lalafo_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lalafo_parser*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
