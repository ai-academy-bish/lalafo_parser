# lalafo.kg — mobile-phone run configuration («Мобильные телефоны», root 1360).
#
# Handsets for sale only: no accessories, no tablets, no laptops, no consoles —
# those are sibling branches, listed at the top of the taxonomy file.
#
#   make parsing_run VERTICAL=phones LIMIT=200      # try small first
#
# Same engine, same tables, same resumability as the other verticals. Like cars,
# the leaves are brands, so `brand` arrives as its own column and model / storage /
# RAM / battery health come from the params mapped in the taxonomy.

# ---------------------------------------------------------------------------
# Which vertical (leaf categories, attribute map, special params)
# ---------------------------------------------------------------------------
categories_file: configs/categories/phones.yaml

# ---------------------------------------------------------------------------
# What to crawl
# ---------------------------------------------------------------------------
scope:
  # Omit both keys to crawl every leaf the taxonomy defines (here: all 32 brands).
  # Listed explicitly for symmetry with the other configs.
  property_types:
    - phone
  deals:
    - sale

  regions:
    - chui
    - issyk_kul
    - talas
    - naryn
    - jalal_abad
    - osh
    - batken

  # Stop after N listings. null = crawl everything (~8 400 handsets).
  max_listings: null
  max_pages_per_stream: null

  # The biggest leaf (Apple iPhone) is ~3 900 ads — less than half the ~9k feed cap,
  # so partitioning never fires here. Left on because it costs nothing when unneeded.
  partition_oversize_by_city: true

# ---------------------------------------------------------------------------
# Cloudflare session (browser warm-up)
# ---------------------------------------------------------------------------
session:
  max_age: 1200
  headless: false
  profile_dirname: cf_profile
  session_filename: cf_session.json

# ---------------------------------------------------------------------------
# HTTP (browserless client)
# ---------------------------------------------------------------------------
http:
  workers: 10
  timeout: 25
  max_retries: 4
  delay: 0.0
  impersonate: chrome131

# ---------------------------------------------------------------------------
# Multiprocessing (detail-fetch stage)
# ---------------------------------------------------------------------------
multiprocessing:
  enabled: true
  processes: null
  threads_per_process: 8
  chunk_size: 200

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
images:
  enabled: true
  workers: 12
  max_per_listing: null
  prefer_webp: false

# ---------------------------------------------------------------------------
# Where scraped data lands (relative to the project root)
# ---------------------------------------------------------------------------
# Its own root, so a phone crawl never mixes with data/ or data_cars/.
storage:
  root: data_phones
  raw_dirname: raw
  photos_dirname: images
  state_dirname: state

# ---------------------------------------------------------------------------
# HuggingFace dataset
# ---------------------------------------------------------------------------
dataset:
  output_dir: hf_dataset_phones
  include_images: true
  max_shard_size: 500MB

  # ~8 400 ads is roughly a tenth of the car set, so the images should fit on disk
  # comfortably and the default staged upload is fine. If they do not, set
  # `stream_upload: true` (it requires hub.push).
  stream_upload: false

  hub:
    # Off until you have decided where this goes. Note listings carry plaintext
    # phone numbers — pick `private: true` or strip the contact columns before
    # publishing. See docs/cars_dataset.md §6.5.
    push: true
    repo_id: aiacademy-kg/lalafo-kg-phones
    private: false
    token_env: HF_TOKEN

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO
  dirname: logs
  progress: true
  color: true
