# Car taxonomy for lalafo.kg — «Транспорт / Продажа авто» (root 1502).
#
# The leaves of this branch are *brands*, not deal types — so every leaf shares
# `type: car` / `deal: sale` and carries an extra `brand` label, which becomes a
# `brand` column on the listing. Model/year/mileage come from the params below.
#
# Other transport branches (Автозапчасти 1620, Автоуслуги 2155, Мототехника 1625,
# Коммерческий транспорт 1725, Велосипеды 1483, Шины и диски 1621, …) can be added
# here or as sibling files — nothing in the code is car-specific.

vertical: cars
title: "Kyrgyzstan Cars (used-car market)"
root_category: 1502
site_path: /kyrgyzstan/avtomobili-s-probegom
guide: docs/cars_dataset.md

# No dimension-table params here: the ЖК / developer / district concepts are
# real-estate-only, so the `complexes` table stays empty for this vertical.
special_params: {}

# param-id -> English column. Ids differ per branch on lalafo (mileage is 56 for
# cars but 2063 for trucks) — that is why the map lives with the taxonomy.
#
# Names promise only what the values deliver: `year`/`mileage_km`/`engine_volume_l`
# are numeric-as-string, but `vin_status` and `battery_capacity` are categorical, so
# they are NOT named as if they were a VIN or a kWh figure. `fuel`,
# `technical_condition` and `payment_terms` are multi-select — see the dataset guide.
params:
  49:   model                 # Модель
  62:   year                  # Год
  56:   mileage_km            # Пробег (км.)
  66:   engine_volume_l       # Объем двигателя
  65:   fuel                  # Топливо
  64:   transmission          # Коробка передач
  244:  drive                 # Привод
  63:   body_type             # Кузов
  106:  steering_wheel        # Руль
  105:  color                 # Цвет
  29:   condition             # Состояние
  1155: technical_condition   # Техническое состояние
  1156: vin_status            # VIN код — a FLAG («с VIN кодом» / «без VIN кода»), not a VIN
  1157: customs_cleared       # Растаможка
  5151: registration_country  # Страна учета
  242:  availability          # Наличие
  1154: payment_terms         # Расчет
  5712: battery_capacity      # Емкость батареи — a band («91–100 кВт·ч»), not a number

# 125 brand leaves under «Продажа авто», biggest first (trailing number =
# ads on the site when this file was generated). None exceeds the ~9 000 feed cap,
# so city partitioning is rarely needed for this branch.
categories:
  1608: {type: car, deal: sale, brand: "Toyota", name: "Toyota"}                      # 7759
  1585: {type: car, deal: sale, brand: "Mercedes-Benz", name: "Mercedes-Benz"}        # 5699
