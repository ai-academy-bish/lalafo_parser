# Real-estate taxonomy for lalafo.kg — «Недвижимость» (root 2029).
#
# This file *is* the vertical: the crawl streams, the attribute map and the
# special params. Point a run config at it with `categories_file:`.
# Regenerate the category list from the live site with `make categories`.

vertical: realestate
title: "Kyrgyzstan Real Estate"
root_category: 2029
site_path: /kyrgyzstan/nedvizhimost
guide: docs/lalafo_dataset.md

# Params that feed dedicated columns / dimension tables rather than plain
# attributes. Omit a key when the vertical has no such concept.
special_params:
  complex: 5592      # value_id -> complexes table (ЖК)
  developer: 2665
  district: 357

# param-id -> English column. Synonyms may share a name and collapse into one
# column. An unlisted param is NOT dropped — it is transliterated.
params:
  68: furniture
  69: rooms
  70: area_m2
  71: land_area_sotka
  226: floor
  3299: floor  # synonym of 226
  228: purpose
  3284: purpose  # synonym of 228
  351: kitchen_area_m2
  354: parking
  357: district
  867: series
  868: legal_documents
  870: utilities
  871: heating
  872: condition
  873: wall_material
  874: year_built
  878: amenities
  3278: amenities  # synonym of 878
  2149: offer_type
  2218: realtor_services
  2665: developer
  2666: deal_terms
  3290: finishing
  3291: layout
  3294: completion_date
  3295: rent_type
  3296: building_type
  3509: floors_total
  5592: complex_name

# Leaf categories = the crawl streams. `type` and `deal` are the two
# classification axes (columns `property_type` / `deal`); `name` is kept in
# Russian so a consumer can always reclassify. Any other key becomes an extra
# label column on the listing.
