# lalafo.kg — used-car run configuration («Транспорт / Продажа авто»).
#
# Same engine, same tables, same resumability as the real-estate run — the only
# structural difference is the taxonomy this points at.
#
#   make parsing_run VERTICAL=cars LIMIT=200      # try small first
#
# The car branch's leaves are *brands*, so `property_types` is just [car] and
# `deals` is just [sale]; the brand arrives as its own `brand` column, and model /
# year / mileage / transmission come from the params mapped in the taxonomy file.

# ---------------------------------------------------------------------------
# Which vertical (leaf categories, attribute map, special params)
# ---------------------------------------------------------------------------
categories_file: configs/categories/cars.yaml

# ---------------------------------------------------------------------------
# What to crawl
# ---------------------------------------------------------------------------
scope:
  # Omit property_types / deals entirely to crawl every leaf the taxonomy defines
  # (here: all 125 brands). Listed explicitly for symmetry with the other configs.
  property_types:
    - car
  deals:
    - sale

  # Restrict to certain oblasts (best-effort, by city). All seven by default.
  regions:
    - chui
    - issyk_kul
    - talas
    - naryn
    - jalal_abad
    - osh
    - batken

  # Stop after N listings. null = crawl everything (~55k cars).
  max_listings: null

  # Cap feed pages per category stream. null = follow to the last page.
  max_pages_per_stream: null

  # No car brand exceeds the ~9k feed cap today (the biggest, Toyota, is ~8.8k),
  # so this rarely fires here — kept on because it costs nothing when unneeded.
  partition_oversize_by_city: true

# ---------------------------------------------------------------------------
# Cloudflare session (browser warm-up)
# ---------------------------------------------------------------------------
session:
  max_age: 1200
  headless: false
  profile_dirname: cf_profile
  session_filename: cf_session.json

# ---------------------------------------------------------------------------
# HTTP (browserless client)
# ---------------------------------------------------------------------------
http:
  workers: 10
  timeout: 25
  max_retries: 4
  delay: 0.0
  impersonate: chrome131

# ---------------------------------------------------------------------------
# Multiprocessing (detail-fetch stage)
# ---------------------------------------------------------------------------
multiprocessing:
  enabled: true
  processes: null
  threads_per_process: 8
  chunk_size: 200

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
images:
  enabled: true
  workers: 12
  max_per_listing: null
  prefer_webp: false

# ---------------------------------------------------------------------------
# Where scraped data lands (relative to the project root)
# ---------------------------------------------------------------------------
# Its own root, so a car crawl never mixes with data/ from the real-estate run.
storage:
  root: data_cars
  raw_dirname: raw
  photos_dirname: images
  state_dirname: state

# ---------------------------------------------------------------------------
# HuggingFace dataset
# ---------------------------------------------------------------------------
dataset:
  output_dir: hf_dataset_cars
  include_images: true
  max_shard_size: 500MB

  hub:
    push: true                          # flip on once you have somewhere to push
    repo_id: aiacademy-kg/lalafo-kg-cars
    private: false
    token_env: HF_TOKEN

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO
  dirname: logs
  progress: true
  color: true
