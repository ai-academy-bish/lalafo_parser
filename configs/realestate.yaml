# lalafo.kg — real-estate run configuration.
#
# A run config says *how* to crawl. *What* to crawl is the taxonomy file below.
# Every key is optional — omit one and the documented default applies.
# See lalafo_parser/config.py for the full, typed schema (a typo here fails loudly
# rather than being silently ignored).
#
#   make parsing_run VERTICAL=realestate      # or: CONFIG=configs/realestate.yaml

# ---------------------------------------------------------------------------
# Which vertical (leaf categories, attribute map, special params)
# ---------------------------------------------------------------------------
categories_file: configs/categories/realestate.yaml

# ---------------------------------------------------------------------------
# What to crawl
# ---------------------------------------------------------------------------
scope:
  # Property types. Comment one out to exclude it.
  # Omit the whole key to take everything the taxonomy defines.
  property_types:
    - apartment
    - house
    - room
    - commercial
    - land
    - garage
    - newbuild
    - resort

  # Deal kinds. Requests (buy_request / rent_request) are people looking, not
  # offers — drop them if you only want listings for sale/rent.
  deals:
    - sale
    - rent
    - daily_rent
    - buy_request
    - rent_request
    - other

  # Restrict to certain oblasts (best-effort, by city). All seven by default.
  regions:
    - chui
    - issyk_kul
    - talas
    - naryn
    - jalal_abad
    - osh
    - batken

  # Stop after N listings. null = crawl everything.
  max_listings: null

  # Cap feed pages per category stream. null = follow to the last page.
  max_pages_per_stream: null

  # A single feed query is capped (~10k rows); a big leaf is re-queried per city
  # to recover the tail. Costs extra requests; worth it for a complete crawl.
  partition_oversize_by_city: true

# ---------------------------------------------------------------------------
# Cloudflare session (browser warm-up)
# ---------------------------------------------------------------------------
session:
  max_age: 1200          # re-harvest the cf_clearance cookie after this many seconds
  headless: false        # nodriver passes Turnstile better headed (use xvfb on a server)
  profile_dirname: cf_profile
  session_filename: cf_session.json

# ---------------------------------------------------------------------------
# HTTP (browserless client)
# ---------------------------------------------------------------------------
http:
  workers: 10            # threads for id discovery
  timeout: 25
  max_retries: 4
  delay: 0.0
  impersonate: chrome131 # curl_cffi TLS target; match the warmed Chrome major

# ---------------------------------------------------------------------------
# Multiprocessing (detail-fetch stage)
# ---------------------------------------------------------------------------
multiprocessing:
  enabled: true
  processes: null            # null = os.cpu_count()
  threads_per_process: 8
  chunk_size: 200

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
images:
  enabled: true
  workers: 12
  max_per_listing: null      # null = download all (~8-20 per ad)
  prefer_webp: false

# ---------------------------------------------------------------------------
# Where scraped data lands (relative to the project root)
# ---------------------------------------------------------------------------
# Give every vertical its own root — two verticals sharing one data/ would
# interleave their listings in the same JSONL tables.
storage:
  root: data
  raw_dirname: raw
  photos_dirname: images
  state_dirname: state       # holds the Cloudflare session + browser profile

# ---------------------------------------------------------------------------
# HuggingFace dataset
# ---------------------------------------------------------------------------
dataset:
  output_dir: hf_dataset
  include_images: true
  max_shard_size: 500MB

  hub:
    push: true
    repo_id: aiacademy-kg/lalafo-kg-realestate
    private: true
    token_env: HF_TOKEN

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO
  dirname: logs
  progress: true
  color: true
